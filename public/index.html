<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading list</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; }
    .app { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input[type=text] { flex: 1; padding: .5rem; font: inherit; }
    button { font: inherit; padding: .4rem .8rem; cursor: pointer; }
    .filters { display: flex; gap: .25rem; margin: 1rem 0; }
    .filters .active { background: #2f5fd0; color: white; }
    .books { list-style: none; padding: 0; }
    .books li { display: flex; justify-content: space-between;
                padding: .5rem 0; border-bottom: 1px solid #dde3e8; }
    .books li.read span { text-decoration: line-through; opacity: .6; }
    .progress { display: flex; align-items: center; gap: .5rem; margin-top: 1rem; }
    .empty { color: #667; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/js/main.js"></script>
</body>
</html>
